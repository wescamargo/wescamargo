<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="titulo desc">
<title id="titulo">Weslei Camargo</title>
<desc id="desc">Weslei Camargo, Head of Data Engineering na Cienty.</desc>
<defs>
  <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf9fd"/><stop offset="1" stop-color="#f6eef7"/></linearGradient>
  <linearGradient id="mag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5ce1"/><stop offset=".55" stop-color="#dc36c0"/><stop offset="1" stop-color="#8b3dff"/></linearGradient>
  <radialGradient id="glow1"><stop offset="0" stop-color="#dc36c0"/><stop offset="1" stop-color="#dc36c0" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2"><stop offset="0" stop-color="#7b3dff"/><stop offset="1" stop-color="#7b3dff" stop-opacity="0"/></radialGradient>
  <pattern id="grade" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#5b2a55" stroke-opacity="0.05"/></pattern>
  <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".4"/></filter>
  <clipPath id="moldura"><rect width="1200" height="400" rx="18"/></clipPath>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Open Sans", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .nome { font-size: 66px; font-weight: 800; letter-spacing: -2.5px; fill: #1d1220; }
  .cargo { font-size: 26px; font-weight: 700; fill: url(#mag); }
  .sub { font-size: 18px; fill: #4a3d52; }
  .meta { font-size: 13.5px; fill: #7b6e85; }
  .pill-t { font-size: 12px; font-weight: 700; letter-spacing: 2.4px; fill: #4a3d52; }
  .chip { fill: #ffffff; stroke: #e7d6e8; }
  .term { font-size: 13.5px; }
  .fade { opacity: 0; animation: entra .9s cubic-bezier(.2,.7,.2,1) forwards; }
  .pulsa { animation: pulsa 7s ease-in-out infinite; }
  .pisca { animation: pisca 1.8s ease-in-out infinite; }
  @keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pulsa { 0%,100% { opacity: 0.28; } 50% { opacity: 0.15; } }
  @keyframes pisca { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fade { opacity: 1; } }
</style>
<g clip-path="url(#moldura)">
  <rect width="1200" height="400" fill="url(#fundo)"/>
  <rect width="1200" height="400" fill="url(#grade)"/>
  <circle cx="160" cy="30" r="360" fill="url(#glow1)" class="pulsa" opacity="0.28"/>
  <circle cx="1120" cy="400" r="340" fill="url(#glow2)" class="pulsa" style="animation-delay:-3.5s" opacity="0.28"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#mag)"/>

  <g class="fade">
    <rect x="64" y="70" width="232" height="30" rx="15" class="chip"/>
    <circle cx="82" cy="85" r="4.5" fill="#3ee08f" class="pisca"/>
    <text x="96" y="89.5" class="pill-t">BUILDING @ CIENTY</text>
  </g>
  <g class="fade" style="animation-delay:.1s"><text x="60" y="178" class="nome">Weslei Camargo</text></g>
  <g class="fade" style="animation-delay:.22s"><text x="64" y="222" class="cargo">Head of Data Engineering</text></g>
  <g class="fade" style="animation-delay:.34s">
    <text x="64" y="266" class="sub">Transformo dado cru em decisão.</text>
    <text x="64" y="292" class="sub" style="fill:#7b6e85">Turning raw data into decisions.</text>
  </g>
  <g class="fade" style="animation-delay:.46s">
    <text x="64" y="336" class="meta mono">BigQuery · Terraform · Python · SQL · Azure · Claude Code</text>
  </g>

  <g class="fade" style="animation-delay:.3s">
    <rect x="690" y="66" width="450" height="270" rx="12" fill="#1a1220" stroke="#3a2b40" filter="url(#sombra)"/>
    <path d="M702 66 H1128 A12 12 0 0 1 1140 78 V98 H690 V78 A12 12 0 0 1 702 66 Z" fill="#251a2c"/>
    <circle cx="712" cy="82" r="5.5" fill="#ff5f57"/><circle cx="730" cy="82" r="5.5" fill="#febc2e"/><circle cx="748" cy="82" r="5.5" fill="#28c840"/>
    <text x="915" y="86.5" class="mono" style="font-size:12px;fill:#8b7f95;text-anchor:middle">~/cienty-data</text>
  </g>
  <clipPath id="c0"><rect x="712" y="116" height="22" width="0"><animate attributeName="width" from="0" to="75" begin="0.80s" dur="0.25s" fill="freeze"/></rect></clipPath><text x="712" y="132" class="mono term" fill="#f6f1f8" clip-path="url(#c0)"><tspan fill="#ff5ce1">❯ </tspan>whoami</text><clipPath id="c1"><rect x="712" y="144" height="22" width="0"><animate attributeName="width" from="0" to="273" begin="1.40s" dur="0.15s" fill="freeze"/></rect></clipPath><text x="712" y="160" class="mono term" fill="#cdc2d4" clip-path="url(#c1)">head of data engineering @ cienty</text><clipPath id="c2"><rect x="712" y="172" height="22" width="0"><animate attributeName="width" from="0" to="257" begin="2.05s" dur="1.02s" fill="freeze"/></rect></clipPath><text x="712" y="188" class="mono term" fill="#f6f1f8" clip-path="url(#c2)"><tspan fill="#ff5ce1">❯ </tspan>terraform apply -auto-approve</text><clipPath id="c3"><rect x="712" y="200" height="22" width="0"><animate attributeName="width" from="0" to="202" begin="3.42s" dur="0.15s" fill="freeze"/></rect></clipPath><text x="712" y="216" class="mono term" fill="#3ee08f" clip-path="url(#c3)">✓ bronze → silver → gold</text><clipPath id="c4"><rect x="712" y="228" height="22" width="0"><animate attributeName="width" from="0" to="336" begin="4.07s" dur="1.37s" fill="freeze"/></rect></clipPath><text x="712" y="244" class="mono term" fill="#f6f1f8" clip-path="url(#c4)"><tspan fill="#ff5ce1">❯ </tspan>claude &quot;cria uma gold de preço por EAN&quot;</text><clipPath id="c5"><rect x="712" y="256" height="22" width="0"><animate attributeName="width" from="0" to="241" begin="5.78s" dur="0.15s" fill="freeze"/></rect></clipPath><text x="712" y="272" class="mono term" fill="#3ee08f" clip-path="url(#c5)">✓ SQL + Terraform + PR aberto</text><clipPath id="c6"><rect x="712" y="284" height="22" width="0"><animate attributeName="width" from="0" to="28" begin="6.43s" dur="0.25s" fill="freeze"/></rect></clipPath><text x="712" y="300" class="mono term" fill="#f6f1f8" clip-path="url(#c6)"><tspan fill="#ff5ce1">❯ </tspan></text><rect x="729.8" y="286" width="9" height="18" fill="#ff5ce1" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.01;.5;.51" dur="1s" begin="6.53s" repeatCount="indefinite"/></rect>
</g>
<rect x=".5" y=".5" width="1199" height="399" rx="18" fill="none" stroke="#e7d6e8"/>
</svg>
