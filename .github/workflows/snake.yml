name: Contribution snake

on:
  schedule:
    - cron: "0 9 * * *" # daily, 06:00 BRT
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gera:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Without SNAKE_TOKEN (classic PAT with read:user) only public contributions
          # are counted; with it, private ones are included too.
          github_token: ${{ secrets.SNAKE_TOKEN || github.token }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#dc36c0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff5ce1

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
