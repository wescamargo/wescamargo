name: Cobra de contribuições

on:
  schedule:
    - cron: "0 9 * * *" # todo dia, 06h BRT
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gera:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Sem SNAKE_TOKEN (PAT classico com escopo read:user) so as contribuicoes
          # publicas aparecem; com ele, as privadas tambem entram na contagem.
          github_token: ${{ secrets.SNAKE_TOKEN || github.token }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#dc36c0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff5ce1

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
